<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>wgslender-lsp test</title>
  <style>
    * { margin: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #1e1e2e; color: #cdd6f4; padding: 20px; }
    h1 { font-size: 16px; font-weight: 500; margin-bottom: 12px; color: #89b4fa; }
    #status { font-size: 13px; margin-bottom: 12px; color: #a6adc8; }
    #status.ready { color: #a6e3a1; }
    #status.error { color: #f38ba8; }
    #editor { border: 1px solid #313244; border-radius: 6px; overflow: hidden; }
    .cm-editor { height: 70vh; }
    .cm-editor .cm-scroller { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 14px; }

    /* Diagnostics */
    .cm-lintRange-error { background: none; text-decoration: underline wavy #f38ba8; }
    .cm-lintRange-warning { background: none; text-decoration: underline wavy #f9e2af; }
    .cm-lintRange-info { background: none; text-decoration: underline wavy #89b4fa; }
    .cm-diagnostic-error { border-left-color: #f38ba8; }
    .cm-diagnostic-warning { border-left-color: #f9e2af; }
    .cm-diagnostic-info { border-left-color: #89b4fa; }
    .cm-lint-marker-error { content: none; color: #f38ba8; }
    .cm-lint-marker-warning { content: none; color: #f9e2af; }

    /* Hover tooltip */
    .cm-tooltip-hover { background: #313244 !important; border: 1px solid #45475a !important; border-radius: 4px; padding: 0; }
    .cm-hover-content { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; padding: 6px 10px; line-height: 1.5; white-space: pre-wrap; max-width: 500px; color: #cdd6f4; }
    .cm-hover-content strong { color: #89dceb; font-weight: 600; }
    .cm-hover-content code { background: #1e1e2e; padding: 1px 4px; border-radius: 2px; font-size: 12px; }
    .cm-hover-content em { color: #a6adc8; font-style: italic; }

    /* Inlay hints */
    .cm-inlay-type { color: #6c7086; font-size: 0.85em; padding: 0 3px; margin-left: 2px; border-radius: 2px; background: rgba(108, 112, 134, 0.1); }
    .cm-inlay-const { color: #a6e3a1; font-size: 0.85em; padding: 0 3px; margin-left: 2px; border-radius: 2px; background: rgba(166, 227, 161, 0.08); }

    /* Code lens */
    .cm-code-lens { color: #6c7086; font-size: 12px; padding: 0 0 2px 4px; line-height: 1.6; font-family: system-ui, sans-serif; }
    .cm-code-lens-item { cursor: default; }
    .cm-code-lens-sep { color: #45475a; margin: 0 6px; }

    /* Document highlight */
    .cm-highlight-ref { background: rgba(137, 180, 250, 0.15); border-radius: 2px; }

    /* Semantic tokens */
    .cm-sem-keyword { color: #cba6f7; }
    .cm-sem-function { color: #89b4fa; }
    .cm-sem-struct { color: #f9e2af; }
    .cm-sem-parameter { color: #fab387; font-style: italic; }
    .cm-sem-variable { color: #cdd6f4; }
    .cm-sem-number { color: #fab387; }
    .cm-sem-type { color: #89dceb; }
    .cm-sem-comment { color: #6c7086; font-style: italic; }
    .cm-sem-decorator { color: #f38ba8; }

    /* Ctrl+click underline */
    .cm-editor .cm-content [class*="cm-sem-"] { cursor: default; }
  </style>
</head>
<body>
  <h1>wgslender-lsp</h1>
  <div id="status">Loading WASM...</div>
  <div id="editor"></div>

  <script type="importmap">
  {
    "imports": {
      "@codemirror/state": "https://esm.sh/@codemirror/state@6",
      "@codemirror/view": "https://esm.sh/@codemirror/view@6",
      "@codemirror/commands": "https://esm.sh/@codemirror/commands@6",
      "@codemirror/autocomplete": "https://esm.sh/@codemirror/autocomplete@6",
      "@codemirror/lint": "https://esm.sh/@codemirror/lint@6",
      "@codemirror/theme-one-dark": "https://esm.sh/@codemirror/theme-one-dark@6",
      "@codemirror/language": "https://esm.sh/@codemirror/language@6",
      "@lezer/highlight": "https://esm.sh/@lezer/highlight@1"
    }
  }
  </script>

  <script type="module">
    import {EditorState, StateField, StateEffect} from "@codemirror/state"
    import {EditorView, keymap, hoverTooltip, Decoration, WidgetType} from "@codemirror/view"
    import {defaultKeymap, indentWithTab} from "@codemirror/commands"
    import {oneDark} from "@codemirror/theme-one-dark"
    import {lintGutter, setDiagnostics} from "@codemirror/lint"
    import {autocompletion} from "@codemirror/autocomplete"

    // =========================================================================
    // WASM LSP
    // =========================================================================

    const _encoder = new TextEncoder()
    const _decoder = new TextDecoder()
    let _wasm = null

    async function initLSP() {
      const response = await fetch('./wgslender-lsp.wasm')
      const wasmModule = await WebAssembly.compileStreaming(response)
      const instance = await WebAssembly.instantiate(wasmModule, {})
      _wasm = instance.exports
    }

    function lspSend(json) {
      const encoded = _encoder.encode(json)
      const ptr = _wasm.wgslender_lsp_alloc(encoded.length)
      if (!ptr) throw new Error('WASM alloc failed')
      new Uint8Array(_wasm.memory.buffer, ptr, encoded.length).set(encoded)
      _wasm.wgslender_lsp_send(ptr, encoded.length)

      const responses = []
      while (true) {
        const rptr = _wasm.wgslender_lsp_recv()
        if (!rptr) break
        const len = new DataView(_wasm.memory.buffer).getUint32(rptr, true)
        const msg = _decoder.decode(new Uint8Array(_wasm.memory.buffer, rptr + 4, len))
        _wasm.wgslender_lsp_dealloc(rptr, len + 4)
        responses.push(JSON.parse(msg))
      }
      return responses
    }

    let reqId = 100
    function lspRequest(method, params) {
      try {
        const id = reqId++
        const responses = lspSend(JSON.stringify({jsonrpc: '2.0', id, method, params}))
        for (const r of responses) {
          if (r.id === id) return r.result
        }
      } catch (e) { console.error('LSP error:', method, e) }
      return null
    }

    // =========================================================================
    // Position utilities
    // =========================================================================

    const FILE_URI = 'file:///shader.wgsl'

    function posToOffset(doc, pos) {
      if (pos.line >= doc.lines) return doc.length
      const line = doc.line(pos.line + 1)
      return Math.min(line.from + pos.character, line.to)
    }

    function offsetToPos(doc, offset) {
      const line = doc.lineAt(offset)
      return {line: line.number - 1, character: offset - line.from}
    }

    function fullRange(doc) {
      const last = doc.line(doc.lines)
      return {
        start: {line: 0, character: 0},
        end: {line: last.number - 1, character: last.length},
      }
    }

    // =========================================================================
    // Decoration infrastructure
    // =========================================================================

    function decoField(effect) {
      return StateField.define({
        create() { return Decoration.none },
        update(decos, tr) {
          for (const e of tr.effects) if (e.is(effect)) return e.value
          return tr.docChanged ? decos.map(tr.changes) : decos
        },
        provide: f => EditorView.decorations.from(f),
      })
    }

    const setTokens = StateEffect.define()
    const setHints = StateEffect.define()
    const setLenses = StateEffect.define()
    const setHighlights = StateEffect.define()

    const tokensField = decoField(setTokens)
    const hintsField = decoField(setHints)
    const lensesField = decoField(setLenses)
    const highlightsField = decoField(setHighlights)

    // =========================================================================
    // Feature: Diagnostics
    // =========================================================================

    let editorView = null

    function pushDiagnosticsToEditor(lspDiags) {
      if (!editorView) return
      const doc = editorView.state.doc
      const cmDiags = []
      for (const d of lspDiags) {
        const from = posToOffset(doc, d.range.start)
        let to = posToOffset(doc, d.range.end)
        if (to <= from) to = Math.min(from + 1, doc.length)
        cmDiags.push({
          from, to,
          severity: d.severity === 1 ? 'error' : d.severity === 2 ? 'warning' : 'info',
          message: d.message,
          source: d.source || 'wgslender',
        })
      }
      editorView.dispatch(setDiagnostics(editorView.state, cmDiags))
    }

    // =========================================================================
    // Feature: Hover
    // =========================================================================

    function renderMarkdown(md) {
      return md
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/`(.+?)`/g, '<code>$1</code>')
        .replace(/_(.+?)_/g, '<em>$1</em>')
        .replace(/\n/g, '<br>')
    }

    const hoverExtension = hoverTooltip((view, pos) => {
      const doc = view.state.doc
      const result = lspRequest('textDocument/hover', {
        textDocument: {uri: FILE_URI},
        position: offsetToPos(doc, pos),
      })
      if (!result || !result.contents) return null

      const content = typeof result.contents === 'string'
        ? result.contents
        : result.contents.value || ''
      if (!content) return null

      let from = pos, to = pos
      if (result.range) {
        from = posToOffset(doc, result.range.start)
        to = posToOffset(doc, result.range.end)
      }

      return {
        pos: from, end: to, above: true,
        create() {
          const dom = document.createElement('div')
          dom.className = 'cm-hover-content'
          dom.innerHTML = renderMarkdown(content)
          return {dom}
        },
      }
    }, {hoverTime: 300})

    // =========================================================================
    // Feature: Semantic Tokens
    // =========================================================================

    const TOKEN_TYPES = ['keyword','function','struct','parameter','variable','number','type','comment','decorator']
    const tokenMarks = Object.fromEntries(TOKEN_TYPES.map(t => [t, Decoration.mark({class: `cm-sem-${t}`})]))

    function refreshSemanticTokens() {
      const result = lspRequest('textDocument/semanticTokens/full', {textDocument: {uri: FILE_URI}})
      if (!result || !result.data || result.data.length === 0) {
        editorView.dispatch({effects: setTokens.of(Decoration.none)})
        return
      }

      const doc = editorView.state.doc
      const data = result.data
      const ranges = []
      let line = 0, char = 0

      for (let i = 0; i < data.length; i += 5) {
        line += data[i]
        if (data[i] > 0) char = 0
        char += data[i + 1]
        const len = data[i + 2]
        const type = TOKEN_TYPES[data[i + 3]]
        if (!type) continue

        if (line >= doc.lines) break
        const docLine = doc.line(line + 1)
        const from = docLine.from + char
        const to = Math.min(from + len, docLine.to)
        if (from < to) ranges.push(tokenMarks[type].range(from, to))
      }

      editorView.dispatch({effects: setTokens.of(Decoration.set(ranges, true))})
    }

    // =========================================================================
    // Feature: Inlay Hints (visible while Alt/Option is held)
    // =========================================================================

    class InlayHintWidget extends WidgetType {
      constructor(label, className, location) { super(); this.label = label; this.className = className; this.location = location }
      eq(other) { return this.label === other.label && this.className === other.className }
      toDOM() {
        const span = document.createElement('span')
        span.className = this.className
        span.textContent = this.label
        if (this.location) {
          span.style.cursor = 'pointer'
          span.style.textDecoration = 'underline'
          span.style.textDecorationStyle = 'dotted'
          span.addEventListener('click', () => {
            if (!editorView) return
            const target = posToOffset(editorView.state.doc, this.location.range.start)
            editorView.dispatch({selection: {anchor: target}, scrollIntoView: true})
            editorView.focus()
          })
        }
        return span
      }
    }

    let cachedHintDecos = Decoration.none
    let altPressed = false

    function refreshInlayHints() {
      const doc = editorView.state.doc
      const result = lspRequest('textDocument/inlayHint', {
        textDocument: {uri: FILE_URI},
        range: fullRange(doc),
      })
      if (!result || result.length === 0) {
        cachedHintDecos = Decoration.none
        if (altPressed) editorView.dispatch({effects: setHints.of(Decoration.none)})
        return
      }

      const ranges = []
      for (const h of result) {
        const offset = posToOffset(doc, h.position)
        // Extract label text and optional location from string or label parts
        let labelText, location
        if (Array.isArray(h.label)) {
          labelText = h.label.map(p => p.value).join('')
          location = h.label.find(p => p.location)?.location
        } else {
          labelText = h.label
        }
        // kind: 1 = type, 2 = parameter
        const className = labelText.startsWith(' =') ? 'cm-inlay-const' : 'cm-inlay-type'
        ranges.push(Decoration.widget({
          widget: new InlayHintWidget(labelText, className, location),
          side: 1,
        }).range(offset))
      }

      ranges.sort((a, b) => a.from - b.from)
      cachedHintDecos = Decoration.set(ranges, true)
      if (altPressed) editorView.dispatch({effects: setHints.of(cachedHintDecos)})
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Alt' && !altPressed) {
        altPressed = true
        if (editorView) editorView.dispatch({effects: setHints.of(cachedHintDecos)})
      }
    })
    document.addEventListener('keyup', e => {
      if (e.key === 'Alt' && altPressed) {
        altPressed = false
        if (editorView) editorView.dispatch({effects: setHints.of(Decoration.none)})
      }
    })
    window.addEventListener('blur', () => {
      if (altPressed) {
        altPressed = false
        if (editorView) editorView.dispatch({effects: setHints.of(Decoration.none)})
      }
    })

    // =========================================================================
    // Feature: Code Lens
    // =========================================================================

    class CodeLensWidget extends WidgetType {
      constructor(items) { super(); this.items = items }
      get estimatedHeight() { return 18 }
      eq(other) { return this.items.length === other.items.length && this.items.every((t, i) => t === other.items[i]) }
      toDOM() {
        const div = document.createElement('div')
        div.className = 'cm-code-lens'
        for (let i = 0; i < this.items.length; i++) {
          if (i > 0) {
            const sep = document.createElement('span')
            sep.className = 'cm-code-lens-sep'
            sep.textContent = '|'
            div.appendChild(sep)
          }
          const span = document.createElement('span')
          span.className = 'cm-code-lens-item'
          span.textContent = this.items[i]
          div.appendChild(span)
        }
        return div
      }
    }

    function refreshCodeLenses() {
      const result = lspRequest('textDocument/codeLens', {textDocument: {uri: FILE_URI}})
      if (!result || result.length === 0) {
        editorView.dispatch({effects: setLenses.of(Decoration.none)})
        return
      }

      const doc = editorView.state.doc
      // Group lenses by start line
      const byLine = new Map()
      for (const lens of result) {
        const line = lens.range.start.line
        const title = lens.command?.title
        if (!title) continue
        if (!byLine.has(line)) byLine.set(line, [])
        byLine.get(line).push(title)
      }

      const ranges = []
      for (const [lineNum, titles] of byLine) {
        if (lineNum >= doc.lines) continue
        const lineStart = doc.line(lineNum + 1).from
        ranges.push(Decoration.widget({
          widget: new CodeLensWidget(titles),
          block: true,
          side: -1,
        }).range(lineStart))
      }

      ranges.sort((a, b) => a.from - b.from)
      editorView.dispatch({effects: setLenses.of(Decoration.set(ranges, true))})
    }

    // =========================================================================
    // Feature: Document Highlight
    // =========================================================================

    const highlightMark = Decoration.mark({class: 'cm-highlight-ref'})

    function refreshDocumentHighlight() {
      if (!editorView) return
      const doc = editorView.state.doc
      const pos = editorView.state.selection.main.head
      const result = lspRequest('textDocument/documentHighlight', {
        textDocument: {uri: FILE_URI},
        position: offsetToPos(doc, pos),
      })

      if (!result || result.length === 0) {
        editorView.dispatch({effects: setHighlights.of(Decoration.none)})
        return
      }

      const ranges = []
      for (const h of result) {
        const from = posToOffset(doc, h.range.start)
        const to = posToOffset(doc, h.range.end)
        if (from < to) ranges.push(highlightMark.range(from, to))
      }

      ranges.sort((a, b) => a.from - b.from)
      editorView.dispatch({effects: setHighlights.of(Decoration.set(ranges, true))})
    }

    // =========================================================================
    // Feature: Go to Definition (Ctrl/Cmd+Click)
    // =========================================================================

    const modKey = /Mac|iPhone|iPad/.test(navigator.platform) ? 'metaKey' : 'ctrlKey'

    const gotoDefExtension = EditorView.domEventHandlers({
      click(event, view) {
        if (!event[modKey]) return false
        const pos = view.posAtCoords({x: event.clientX, y: event.clientY})
        if (pos == null) return false

        const doc = view.state.doc
        const result = lspRequest('textDocument/definition', {
          textDocument: {uri: FILE_URI},
          position: offsetToPos(doc, pos),
        })
        if (!result || !result.range) return false

        const target = posToOffset(doc, result.range.start)
        view.dispatch({selection: {anchor: target}, scrollIntoView: true})
        view.focus()
        return true
      },
    })

    // =========================================================================
    // Feature: Autocompletion
    // =========================================================================

    const COMPLETION_KIND_MAP = {
      1: 'text', 2: 'method', 3: 'function', 4: 'constructor', 5: 'field',
      6: 'variable', 7: 'class', 8: 'interface', 9: 'module', 10: 'property',
      14: 'keyword', 21: 'constant', 22: 'class',
    }

    function wgslCompletionSource(context) {
      const word = context.matchBefore(/[\w]*/)
      const prev = context.pos > 0 ? context.state.doc.sliceString(context.pos - 1, context.pos) : ''

      if (!context.explicit && prev !== '.' && prev !== '@') {
        if (!word || word.to - word.from < 2) return null
      }

      const result = lspRequest('textDocument/completion', {
        textDocument: {uri: FILE_URI},
        position: offsetToPos(context.state.doc, context.pos),
      })
      if (!result) return null
      const items = Array.isArray(result) ? result : (result.items || [])
      if (items.length === 0) return null

      const from = word ? word.from : context.pos
      return {
        from,
        options: items.map(item => ({
          label: item.label,
          type: COMPLETION_KIND_MAP[item.kind] || 'text',
          detail: item.detail || '',
        })),
      }
    }

    // =========================================================================
    // Document sync + feature refresh
    // =========================================================================

    let docVersion = 0
    let debounceTimer = null
    let highlightTimer = null

    function validateAndRefresh(source) {
      const responses = lspSend(JSON.stringify({
        jsonrpc: '2.0', method: 'textDocument/didChange',
        params: {
          textDocument: {uri: FILE_URI, version: ++docVersion},
          contentChanges: [{text: source}],
        }
      }))

      for (const r of responses) {
        if (r.method === 'textDocument/publishDiagnostics') {
          pushDiagnosticsToEditor(r.params.diagnostics)
        }
      }

      refreshSemanticTokens()
      refreshInlayHints()
      refreshCodeLenses()
      refreshDocumentHighlight()
    }

    const docChangeListener = EditorView.updateListener.of(update => {
      if (update.docChanged) {
        clearTimeout(debounceTimer)
        debounceTimer = setTimeout(() => validateAndRefresh(update.state.doc.toString()), 200)
      }
      if (update.selectionSet && !update.docChanged) {
        clearTimeout(highlightTimer)
        highlightTimer = setTimeout(refreshDocumentHighlight, 100)
      }
    })

    // =========================================================================
    // Sample shader
    // =========================================================================

    const sampleShader = `// wgslender-lsp demo — hover, inlay hints, code lens, and more.
// Hover over identifiers and operators. Ctrl+Click to go to definition.
// Type . or @ for completions.

const WORKGROUP_SIZE = 64;
const TILE_DIM = 16;
const BUFFER_SIZE = TILE_DIM * TILE_DIM;

struct Particle {
    position: vec3f,
    velocity: vec3f,
    lifetime: f32,
};

@group(0) @binding(0) var<storage, read_write> particles: array<Particle>;
@group(0) @binding(1) var<uniform> dt: f32;
@group(0) @binding(2) var<uniform> gravity: vec3f;

fn clamp_speed(v: vec3f, max_speed: f32) -> vec3f {
    let speed = length(v);
    if speed > max_speed {
        return normalize(v) * max_speed;
    }
    return v;
}

@compute @workgroup_size(WORKGROUP_SIZE)
fn simulate(@builtin(global_invocation_id) gid: vec3u) {
    let i = gid.x;
    var p = particles[i];

    p.velocity += gravity * dt;
    p.velocity = clamp_speed(p.velocity, 10.0);
    p.position += p.velocity * dt;
    p.lifetime -= dt;

    particles[i] = p;
}
`

    // =========================================================================
    // Editor setup
    // =========================================================================

    const statusEl = document.getElementById('status')

    try {
      await initLSP()

      // Initialize LSP
      lspSend(JSON.stringify({jsonrpc: '2.0', id: 1, method: 'initialize', params: {capabilities: {}}}))
      lspSend(JSON.stringify({jsonrpc: '2.0', method: 'initialized', params: {}}))

      // Open document
      const openResponses = lspSend(JSON.stringify({
        jsonrpc: '2.0', method: 'textDocument/didOpen',
        params: {
          textDocument: {uri: FILE_URI, languageId: 'wgsl', version: ++docVersion, text: sampleShader},
        }
      }))

      // Create editor
      editorView = new EditorView({
        state: EditorState.create({
          doc: sampleShader,
          extensions: [
            keymap.of([...defaultKeymap, indentWithTab]),
            oneDark,
            lintGutter(),
            tokensField,
            hintsField,
            lensesField,
            highlightsField,
            hoverExtension,
            gotoDefExtension,
            autocompletion({override: [wgslCompletionSource]}),
            docChangeListener,
          ],
        }),
        parent: document.getElementById('editor'),
      })

      // Apply initial diagnostics
      for (const r of openResponses) {
        if (r.method === 'textDocument/publishDiagnostics') {
          pushDiagnosticsToEditor(r.params.diagnostics)
        }
      }

      // Initial feature refresh
      refreshSemanticTokens()
      refreshInlayHints()
      refreshCodeLenses()

      statusEl.textContent = 'Ready — hover, Ctrl+Click, type . or @ for completions'
      statusEl.className = 'ready'
    } catch (e) {
      statusEl.textContent = 'Error: ' + e.message
      statusEl.className = 'error'
      console.error(e)
    }
  </script>
</body>
</html>
