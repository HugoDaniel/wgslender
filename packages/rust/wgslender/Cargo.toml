[package]
name = "wgslender"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Minify, validate, lint, reflect, compile and refactor WGSL shaders."
readme.workspace = true
keywords.workspace = true
categories.workspace = true

# The examples and the fixtures they read, because an example that will not
# build is worse than no example. Not the integration tests, and emphatically
# not `tests/ui/`: those goldens pin what *this* compiler version prints, and
# they belong to the repository's gate rather than to anyone's dependency.
include = [
    "src/**/*.rs",
    "examples/**/*.rs",
    "tests/fixtures/demo.wgsl",
    "tests/fixtures/layouts.wgsl",
]

# docs.rs builds with the default features unless told otherwise, and the two
# feature-gated macros are half of what there is to read about.
[package.metadata.docs.rs]
all-features = true

[features]
default = ["macros"]
macros = ["dep:wgslender-macros"]
# `CompressedWgsl`, plus `include_wgsl_compressed!` when there are macros at all
# — the `?` keeps this from dragging the proc-macro in behind the caller's back.
compress = ["wgslender-core/compress", "wgslender-macros?/compress"]

[dependencies]
wgslender-core.workspace = true
wgslender-macros = { workspace = true, optional = true }

[dev-dependencies]
bytemuck.workspace = true
trybuild.workspace = true

# Not a `#![cfg(...)]`: an example whose `main` is compiled away is an example
# with no `main`. Cargo skips the target instead.
[[example]]
name = "embed_compressed"
required-features = ["macros", "compress"]

[[example]]
name = "include_wgsl"
required-features = ["macros"]

[[example]]
name = "wgsl_module"
required-features = ["macros"]

[lints]
workspace = true
