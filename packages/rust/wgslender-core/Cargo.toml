[package]
name = "wgslender-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Safe Rust API over the wgslender WGSL minifier C library. Implementation detail of the `wgslender` crate."
readme.workspace = true
keywords.workspace = true
categories.workspace = true

include = ["src/**/*.rs"]

# `CompressedWgsl` is feature-gated, and a type missing from the documentation
# is a type nobody finds.
[package.metadata.docs.rs]
all-features = true

[features]
# `CompressedWgsl`: shader text stored DEFLATE-compressed, inflated on first
# use. Off by default — a caller who embeds plain text pays nothing for it.
compress = ["dep:miniz_oxide"]

[dependencies]
wgslender-sys.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

miniz_oxide = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
