[workspace]
resolver = "3"
members = ["wgslender", "wgslender-core", "wgslender-macros", "wgslender-sys", "xtask"]

[workspace.package]
version = "1.2.3"
edition = "2024"
rust-version = "1.85"
license = "CC0-1.0"
authors = ["Hugo Daniel <mail@hugodaniel.pt>"]
repository = "https://github.com/HugoDaniel/wgslender"
# One README for the family. An inherited `readme` resolves against the
# workspace root, and `cargo package` copies the file into each crate, so the
# four of them cannot describe the same library four differing ways.
readme = "README.md"
# Five is the crates.io maximum, so these are the five words someone with this
# problem would actually type.
keywords = ["wgsl", "webgpu", "shader", "minifier", "wgpu"]
categories = ["compression", "game-development", "wasm"]

[workspace.dependencies]
wgslender-core = { path = "wgslender-core", version = "1.2.3" }
wgslender-macros = { path = "wgslender-macros", version = "1.2.3" }
wgslender-sys = { path = "wgslender-sys", version = "1.2.3" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"

# The macros crate parses a literal and a handful of `key = value` pairs, so
# syn's default features — derive machinery and the full expression grammar —
# are all weight it never uses.
proc-macro2 = "1.0.104"
quote = "1.0.42"
syn = { version = "2.0.114", default-features = false, features = ["parsing", "printing", "proc-macro"] }

# DEFLATE, in Rust, so that embedding a compressed shader needs no C toolchain
# beyond the one already building the library.
miniz_oxide = "0.9.1"

trybuild = "1.0.116"

# Properties, for the questions a table cannot ask: that no input panics, and
# that minifying twice is minifying once. A dev-dependency only.
proptest = "1.11.0"

# Only ever a dev-dependency: `wgsl_module!` can put bytemuck's derives on the
# structs it generates, and the promise that they *derive* — that the explicit
# padding leaves no implicit padding behind — is worth a test rather than a
# sentence in the documentation.
bytemuck = { version = "1.25.2", features = ["derive"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
missing_safety_doc = "deny"
