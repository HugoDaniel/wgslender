[package]
name = "wgslender-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Compile-time WGSL embedding macros. Implementation detail of the `wgslender` crate."

[lib]
proc-macro = true

[features]
# `include_wgsl_compressed!`. The compressor lives in wgslender-core next to the
# decompressor, so this feature only asks core for it — nothing here needs to
# know what DEFLATE is.
compress = ["wgslender-core/compress"]

[dependencies]
wgslender-core.workspace = true

proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true

[lints]
workspace = true
