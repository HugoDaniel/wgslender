name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Run tests
        run: zig build test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build CLI
        run: zig build -Doptimize=ReleaseSafe

      - name: Build WASM
        run: zig build wasm

      - name: Build LSP
        run: zig build lsp -Doptimize=ReleaseSafe

      - name: Build LSP WASM
        run: zig build lsp-wasm

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            zig-out/bin/wgslender
            zig-out/bin/wgslender.wasm
            zig-out/bin/wgslender-lsp
            zig-out/bin/wgslender-lsp.wasm

  npm-test:
    name: NPM wrapper test
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build WASM
        run: zig build wasm

      - name: Stage built WASM into npm package
        run: cp zig-out/bin/wgslender.wasm npm/wgslender/wgslender.wasm

      - name: Run npm tests
        working-directory: npm/wgslender
        run: npm test
